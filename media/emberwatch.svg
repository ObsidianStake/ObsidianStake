<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="ember" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <style>
      .t{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .spark{animation:up 2.4s ease-in infinite}
      .p2{animation-delay:.8s}.p3{animation-delay:1.6s}
      @keyframes up{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
    </style>
  </defs>
  <rect x="1" y="1" width="598" height="318" rx="6" fill="#0B0712" stroke="#3B1D6E" stroke-width="2"/>

  <!-- pixel flame -->
  <g transform="translate(40 34)">
    <rect x="12" y="0" width="6" height="6" fill="#A855F7"/>
    <rect x="6" y="6" width="18" height="6" fill="#A855F7"/>
    <rect x="0" y="12" width="30" height="12" fill="url(#ember)"/>
    <rect x="6" y="24" width="18" height="6" fill="#F97316"/>
    <rect x="12" y="16" width="6" height="8" fill="#FDE68A"/>
    <rect class="spark" x="4" y="0" width="3" height="3" fill="#FDBA74"/>
    <rect class="spark p2" x="24" y="2" width="3" height="3" fill="#C084FC"/>
    <rect class="spark p3" x="14" y="-4" width="2" height="2" fill="#FDBA74"/>
  </g>
  <text x="86" y="52" class="t" font-size="22" font-weight="800" letter-spacing="3" fill="#F5EBFF">EMBERWATCH</text>
  <text x="86" y="72" class="t" font-size="12" fill="#A78BFA">releases read from the repo, not the press release</text>

  <rect x="40" y="94" width="520" height="1" fill="#3B1D6E"/>

  <g class="t" font-size="13">
    <g class="row">
      <text x="40" y="126" fill="#C4B5FD">APTOS</text>
      <text x="170" y="126" fill="#F5EBFF">aptos-node-v1.49.6</text>
      <text x="560" y="126" text-anchor="end" fill="#86EFAC">patch</text>
    </g>
    <g class="row r2">
      <text x="40" y="158" fill="#C4B5FD">BERACHAIN</text>
      <text x="170" y="158" fill="#F5EBFF">v1.5.0</text>
      <text x="560" y="158" text-anchor="end" fill="#FDBA74">minor</text>
    </g>
    <g class="row r3">
      <text x="40" y="190" fill="#C4B5FD">SUI</text>
      <text x="170" y="190" fill="#F5EBFF">testnet-v1.82.1 · consensus</text>
      <text x="560" y="190" text-anchor="end" fill="#86EFAC">patch</text>
    </g>
  </g>

  <rect x="40" y="214" width="520" height="1" fill="#3B1D6E"/>

  <g class="t" text-anchor="middle">
    <text x="127" y="256" font-size="26" font-weight="800" fill="#F5EBFF">26</text>
    <text x="127" y="278" font-size="10" letter-spacing="2" fill="#A78BFA">CHAINS</text>
    <text x="300" y="256" font-size="26" font-weight="800" fill="#F5EBFF">7</text>
    <text x="300" y="278" font-size="10" letter-spacing="2" fill="#A78BFA">FORGES</text>
    <text x="473" y="256" font-size="26" font-weight="800" fill="#F5EBFF">JSON</text>
    <text x="473" y="278" font-size="10" letter-spacing="2" fill="#A78BFA">OPEN FEED</text>
  </g>
</svg>
