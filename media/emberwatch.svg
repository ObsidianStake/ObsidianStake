<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="ember" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#0B0712" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .spark{animation:up 2.6s ease-in infinite}
      .p2{animation-delay:.9s}.p3{animation-delay:1.7s}
      @keyframes up{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-46px);opacity:0}}
      .cur{animation:bl 1.1s steps(1) infinite}
      @keyframes bl{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="300" fill="#0B0712"/>
  <rect width="1200" height="300" fill="url(#heat)"/>
  <rect x="0" y="0" width="1200" height="4" fill="#F97316"/>

  <!-- pixel flame, large -->
  <g transform="translate(64 92) scale(2)">
    <rect x="12" y="0" width="6" height="6" fill="#A855F7"/>
    <rect x="6" y="6" width="18" height="6" fill="#A855F7"/>
    <rect x="0" y="12" width="30" height="12" fill="url(#ember)"/>
    <rect x="6" y="24" width="18" height="6" fill="#F97316"/>
    <rect x="12" y="16" width="6" height="8" fill="#FDE68A"/>
    <rect class="spark" x="4" y="0" width="3" height="3" fill="#FDBA74"/>
    <rect class="spark p2" x="24" y="2" width="3" height="3" fill="#C084FC"/>
    <rect class="spark p3" x="14" y="-4" width="2" height="2" fill="#FDBA74"/>
  </g>

  <text x="64" y="206" class="t" font-size="34" font-weight="800" letter-spacing="4" fill="#F5EBFF">EMBERWATCH</text>
  <text x="64" y="236" class="t" font-size="14" fill="#FDBA74">what shipped, read from the repo</text>
  <text x="64" y="260" class="t" font-size="14" fill="#A78BFA">26 chains · 7 forges · open JSON</text>

  <!-- terminal log -->
  <rect x="470" y="40" width="680" height="220" rx="6" fill="#120A1F" stroke="#3B1D6E" stroke-width="2"/>
  <g fill="#3B1D6E"><circle cx="492" cy="60" r="5"/><circle cx="510" cy="60" r="5"/><circle cx="528" cy="60" r="5"/></g>
  <text x="1130" y="64" text-anchor="end" class="t" font-size="11" letter-spacing="2" fill="#7C3AED">LATEST ENTRIES</text>
  <g class="t" font-size="15">
    <text x="494" y="108" fill="#7C3AED">›</text>
    <text x="514" y="108" fill="#C4B5FD">aptos</text>
    <text x="640" y="108" fill="#F5EBFF">aptos-node-v1.49.6</text>
    <text x="1128" y="108" text-anchor="end" fill="#86EFAC">patch</text>

    <text x="494" y="144" fill="#7C3AED">›</text>
    <text x="514" y="144" fill="#C4B5FD">dydx</text>
    <text x="640" y="144" fill="#F5EBFF">indexer/v9.5.10</text>
    <text x="1128" y="144" text-anchor="end" fill="#86EFAC">patch</text>

    <text x="494" y="180" fill="#7C3AED">›</text>
    <text x="514" y="180" fill="#C4B5FD">berachain</text>
    <text x="640" y="180" fill="#F5EBFF">v1.5.0</text>
    <text x="1128" y="180" text-anchor="end" fill="#FDBA74">minor</text>

    <text x="494" y="216" fill="#7C3AED">›</text>
    <text x="514" y="216" fill="#C4B5FD">sui</text>
    <text x="640" y="216" fill="#F5EBFF">testnet-v1.82.1 · consensus</text>
    <text x="1128" y="216" text-anchor="end" fill="#86EFAC">patch</text>

    <text x="494" y="246" fill="#7C3AED">›<tspan class="cur" fill="#F5EBFF"> _</tspan></text>
  </g>
</svg>
