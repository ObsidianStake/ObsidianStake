<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <radialGradient id="planet" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset=".55" stop-color="#5B21B6"/>
      <stop offset="1" stop-color="#1E0B3A"/>
    </radialGradient>
    <clipPath id="card"><rect x="1" y="1" width="598" height="318" rx="6"/></clipPath>
    <style>
      .t{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .front{animation:sway 6s ease-in-out infinite}
      @keyframes sway{0%,100%{transform:translateX(-18px)}50%{transform:translateX(18px)}}
      .b{animation:bu 1.8s ease-in-out infinite}
      .s{animation:bu 1.8s ease-in-out infinite .9s}
      @keyframes bu{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="600" height="320" fill="#0B0712"/>
    <ellipse cx="300" cy="420" rx="460" ry="260" fill="url(#planet)"/>
    <g stroke="#C4B5FD" stroke-opacity=".18" fill="none">
      <ellipse cx="300" cy="420" rx="380" ry="200"/>
      <ellipse cx="300" cy="420" rx="300" ry="150"/>
      <ellipse cx="300" cy="420" rx="210" ry="100"/>
    </g>
    <!-- front line -->
    <g class="front">
      <rect x="299" y="168" width="3" height="152" fill="#F5EBFF" opacity=".85"/>
      <rect x="296" y="168" width="9" height="3" fill="#F5EBFF"/>
    </g>
    <!-- buyers / sellers -->
    <g class="b" fill="#4ADE80">
      <rect x="150" y="214" width="6" height="6"/><rect x="176" y="240" width="6" height="6"/>
      <rect x="130" y="262" width="6" height="6"/><rect x="204" y="226" width="6" height="6"/>
      <rect x="228" y="268" width="6" height="6"/>
    </g>
    <g class="s" fill="#F87171">
      <rect x="444" y="214" width="6" height="6"/><rect x="418" y="244" width="6" height="6"/>
      <rect x="466" y="262" width="6" height="6"/><rect x="392" y="226" width="6" height="6"/>
      <rect x="372" y="270" width="6" height="6"/>
    </g>
  </g>
  <rect x="1" y="1" width="598" height="318" rx="6" fill="none" stroke="#3B1D6E" stroke-width="2"/>

  <text x="40" y="52" class="t" font-size="22" font-weight="800" letter-spacing="3" fill="#F5EBFF">CELESTIA FIGHTS</text>
  <text x="40" y="72" class="t" font-size="12" fill="#A78BFA">every TIA trade is a soldier on the purple crust</text>

  <g class="t" font-size="16" font-weight="800">
    <rect x="216" y="98" width="168" height="34" rx="17" fill="#0B0712" stroke="#3B1D6E"/>
    <text x="250" y="121" fill="#4ADE80" text-anchor="middle">▲ BUY</text>
    <text x="300" y="121" fill="#A78BFA" text-anchor="middle" font-size="12">VS</text>
    <text x="350" y="121" fill="#F87171" text-anchor="middle">SELL ▼</text>
  </g>
</svg>
