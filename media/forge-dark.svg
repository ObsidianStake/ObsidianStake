<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="45%">
      <stop offset="0" stop-color="#7C2BEA" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0B0712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1150"/>
      <stop offset="1" stop-color="#0B0712"/>
    </linearGradient>
    <style>
      .t{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .star{fill:#E9D5FF;animation:tw 3.2s ease-in-out infinite}
      .s2{animation-delay:1.1s}.s3{animation-delay:2.2s}
      @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
      .core{animation:fl 5s ease-in-out infinite;transform-origin:600px 120px}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      .cur{animation:bl 1.1s steps(1) infinite}
      @keyframes bl{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="360" fill="#0B0712"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- stars -->
  <g>
    <rect class="star" x="84" y="42" width="3" height="3"/>
    <rect class="star s2" x="212" y="118" width="2" height="2"/>
    <rect class="star s3" x="318" y="58" width="3" height="3"/>
    <rect class="star" x="436" y="26" width="2" height="2"/>
    <rect class="star s2" x="772" y="40" width="3" height="3"/>
    <rect class="star s3" x="868" y="104" width="2" height="2"/>
    <rect class="star" x="980" y="30" width="2" height="2"/>
    <rect class="star s2" x="1092" y="88" width="3" height="3"/>
    <rect class="star s3" x="1140" y="166" width="2" height="2"/>
    <rect class="star" x="52" y="174" width="2" height="2"/>
    <rect class="star s3" x="150" y="226" width="2" height="2"/>
    <rect class="star s2" x="1032" y="214" width="2" height="2"/>
  </g>

  <!-- pixel moon -->
  <g fill="#C4B5FD" opacity=".85">
    <rect x="1050" y="34" width="24" height="6"/><rect x="1044" y="40" width="36" height="6"/>
    <rect x="1040" y="46" width="44" height="18"/><rect x="1044" y="64" width="36" height="6"/>
    <rect x="1050" y="70" width="24" height="6"/>
  </g>
  <g fill="#8B5CF6" opacity=".7"><rect x="1052" y="50" width="6" height="6"/><rect x="1066" y="60" width="8" height="4"/></g>

  <!-- obsidian core: isometric cube -->
  <g class="core">
    <polygon points="600,58 652,88 600,118 548,88" fill="#A855F7"/>
    <polygon points="548,88 600,118 600,178 548,148" fill="#5B21B6"/>
    <polygon points="652,88 600,118 600,178 652,148" fill="#7C3AED"/>
    <polygon points="600,82 618,92 600,102 582,92" fill="#0B0712" opacity=".55"/>
    <polyline points="548,88 600,58 652,88" fill="none" stroke="#E9D5FF" stroke-width="2" opacity=".7"/>
  </g>

  <!-- ridge -->
  <polygon points="0,360 0,300 70,272 140,290 230,250 320,286 410,262 470,282 540,256 600,270 660,252 740,284 830,258 900,280 990,248 1080,284 1150,266 1200,280 1200,360" fill="url(#ridge)"/>

  <text x="600" y="222" text-anchor="middle" class="t" font-size="15" letter-spacing="9" fill="#C4B5FD">OBSIDIAN STAKE</text>
  <text x="600" y="276" text-anchor="middle" class="t" font-size="46" font-weight="800" letter-spacing="3" fill="#F5EBFF">FORGED IN THE BLOCK</text>
  <text x="600" y="314" text-anchor="middle" class="t" font-size="14" letter-spacing="2" fill="#A78BFA">validator · chronicle · battlefront<tspan class="cur" fill="#E9D5FF"> _</tspan></text>
</svg>
